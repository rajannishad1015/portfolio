<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Rajan Nishad</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --color-cream: #FFFDF5;
        --color-ink: #1E293B;
        --color-accent: #7C3AED;
        --color-sun: #FBBF24;
        --color-pop: #F472B6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--color-cream);
        color: var(--color-ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 2.5px solid var(--color-ink);
        border-radius: 24px;
        padding: 2.5rem 2rem;
        max-width: 480px;
        width: 100%;
        box-shadow: 6px 6px 0 0 var(--color-ink);
      }
      .badge {
        display: inline-block;
        background: var(--color-sun);
        border: 2px solid var(--color-ink);
        border-radius: 9999px;
        font-weight: 800;
        font-size: 0.85rem;
        padding: 0.25rem 0.85rem;
        margin-bottom: 1rem;
        box-shadow: 2px 2px 0 0 var(--color-ink);
      }
      h1 {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 900;
        line-height: 1;
        margin-bottom: 0.75rem;
        color: var(--color-accent);
      }
      p {
        font-size: 1.1rem;
        color: #475569;
        margin-bottom: 1.75rem;
        line-height: 1.5;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--color-ink);
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        border: 2px solid var(--color-ink);
        box-shadow: 4px 4px 0 0 var(--color-pop);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 0 var(--color-pop);
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 0 var(--color-pop);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Error 404</span>
      <h1>Page Not Found</h1>
      <p>The page you are looking for doesn't exist or has moved. Let's get you back to the portfolio.</p>
      <a href="/" class="btn">← Back to Rajan's Portfolio</a>
    </div>
  </body>
</html>
